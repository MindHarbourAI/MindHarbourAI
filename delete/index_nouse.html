<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindHarbourAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9f9f9;
      color: #1f2937;
    }
    .container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 4rem 8%;
      min-height: 50vh;
    }
    .left {
      max-width: 50%;
    }
    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 2rem;
    }
    .logo img {
      height: 150px;
      margin-right: 10px;
    }
    .logo h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #091b46;
      font-style: normal;
    }
    .tagline {
      font-size: 3.4rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .description {
      font-size: 1rem;
      color: #4b5563;
      margin-bottom: 2rem;
      line-height: 1.6;
      font-style: italic;
    }
    .cta-button {
      background-color: #091b46;
      color: #ffffff;
      padding: 0.8rem 1.6rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }
    .right img {
      max-width: 80%;
      height: auto;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        text-align: center;
      }
      .left, .right {
        max-width: 100%;
      }
      .right {
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo">
        <img src="./logoImage.png" alt="MindHarbourAI Logo">
        <h1>MindHarbourAI</h1>
      </div>
      <h2 class="tagline">Innovating Productivity, Powered by AI</h2>
      <p class="description">
        MindHarbourAI is your trusted hub for intelligent productivity tools. Explore modern, AI-powered solutions tailored for task management, workflow automation, and smart insights.
      </p>
      <a href="#products" class="cta-button">Explore Products</a>
    </div>
    <div class="right">
      <img src="side.png" alt="MindHarbourAI Dashboard Illustration">
    </div>
  </div>
</body>
</html>
