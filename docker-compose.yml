version: '3.8'

services:
  mindharbor-landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SAILANCHOR_URL: ${VITE_SAILANCHOR_URL:-https://sailanchor.mindharbourai.com}
        VITE_SAILTASK_URL: ${VITE_SAILTASK_URL:-https://sailtask.mindharbourai.com}
    container_name: mindharbor_landing
    restart: always
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
